---
# Codacy: files it does not analyse. composer.lock is generated by Composer;
# assets/build/ by the JavaScript build, whose sources in packages/ are
# analysed. ESLint and PHP Mess Detector read .eslintrc.json and
# phpmd.xml.dist (DEVELOPMENT.md → Services setup).
exclude_paths:
  - "composer.lock"
  - "assets/build/**"
  # Shared starter core files (scripts/core-files.txt): the starter holds the
  # master copy and is analysed there; a copy here must not be edited, so
  # complexity findings are fixed upstream and synced back.
  - "includes/wpallstars-licence/**"
  - "scripts/lib/shop-release-remote.php"
