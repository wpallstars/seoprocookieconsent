<?xml version="1.0" encoding="UTF-8"?>
<!--
  SEO Pro Cookie Consent icon (WordPress.org icons).
  Source: .wordpress-org/icon.svg. Edit that, then run scripts/build-banner.sh,
  which exports icon-256x256.png and icon-128x128.png from it.
  The banner's picture (.wordpress-org/banner.svg) on its own: the wpallstars
  plugin stack in red only with the cookie on its top tile, the logo's arc of
  five stars, and the red double
  stripes with cream between, on the banner's navy. No words, so it reads at
  128 pixels. Keep the picture in step with the banner's.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>SEO Pro Cookie Consent</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000c1f"/>
      <stop offset="0.55" stop-color="#001537"/>
      <stop offset="1" stop-color="#0d264d"/>
    </linearGradient>
    <radialGradient id="glow-red" cx="128" cy="150" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bb0000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bb0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="1214" cy="76" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc94d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="top-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#bb0000"/>
    </linearGradient>
    <linearGradient id="top-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="1" stop-color="#e03131"/>
    </linearGradient>
    <linearGradient id="top-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c81e1e"/>
      <stop offset="1" stop-color="#7a0000"/>
    </linearGradient>
    <!-- A five-pointed star, radius 1, centred on 0,0 -->
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
    <linearGradient id="cookie-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d08a"/>
      <stop offset="1" stop-color="#d6913d"/>
    </linearGradient>
    <!-- The banner's cookie (keep the two in step): a bitten disc and its
         chocolate chips through the top tile's face matrix. -->
    <path id="cookie" transform="matrix(4.95 2.871 -4.95 2.871 1214 -57.42)" d="M18.16 9.15 A8.2 8.2 0 1 1 10.85 1.84 A3 3 0 0 0 14.38 5.62 A3 3 0 0 0 18.16 9.15 Z"/>
    <g id="chips" transform="matrix(4.95 2.871 -4.95 2.871 1214 -57.42)">
      <circle cx="6.8" cy="7.4" r="1.25"/>
      <circle cx="11.2" cy="10.6" r="1.1"/>
      <circle cx="7.2" cy="13.4" r="1"/>
      <circle cx="12.6" cy="14.6" r="1.2"/>
      <circle cx="15.4" cy="11.2" r="0.9"/>
      <circle cx="9.8" cy="4.6" r="0.85"/>
      <circle cx="4.6" cy="10.6" r="0.8"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow-red)"/>

  <!-- wpallstars.com's red double lines, with a cream line between them. -->
  <g>
    <rect y="0" width="256" height="4" fill="#bb0000"/>
    <rect y="4" width="256" height="3" fill="#ffffea"/>
    <rect y="7" width="256" height="4" fill="#bb0000"/>
    <rect y="245" width="256" height="4" fill="#bb0000"/>
    <rect y="249" width="256" height="3" fill="#ffffea"/>
    <rect y="252" width="256" height="4" fill="#bb0000"/>
  </g>

  <!-- The banner's picture, in the banner's coordinates: 376 x 443 from
       1026,24, centred on 1214,245.5, scaled to fit between the stripes. -->
  <g transform="translate(128 128) scale(0.5) translate(-1214 -245.5)">
  <!-- The stack: three red tiles, as on the banner (keep the two in step). -->
  <g stroke-linejoin="round">
    <g transform="translate(0 350)">
      <polygon points="1064,0 1214,87 1214,117 1064,30" fill="#5c0000"/>
      <polygon points="1214,87 1364,0 1364,30 1214,117" fill="#420000"/>
      <polygon points="1214,-87 1364,0 1214,87 1064,0" fill="url(#top-blue)"/>
      <polygon points="1214,-61 1319,0 1214,61 1109,0" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    </g>
    <g transform="translate(0 294)">
      <polygon points="1064,0 1214,87 1214,117 1064,30" fill="#c22424"/>
      <polygon points="1214,87 1364,0 1364,30 1214,117" fill="#9e1414"/>
      <polygon points="1214,-87 1364,0 1214,87 1064,0" fill="url(#top-cream)"/>
      <polygon points="1214,-61 1319,0 1214,61 1109,0" fill="none" stroke="#001537" stroke-opacity="0.18" stroke-width="2"/>
    </g>
    <g transform="translate(0 238)">
      <polygon points="1064,0 1214,87 1214,117 1064,30" fill="#940000"/>
      <polygon points="1214,87 1364,0 1364,30 1214,117" fill="#700000"/>
      <polygon points="1214,-87 1364,0 1214,87 1064,0" fill="url(#top-red)"/>
      <!-- The cookie, raised a little off the face, as on the banner. -->
      <use xlink:href="#cookie" transform="translate(5 3)" fill="#5c0000" fill-opacity="0.55"/>
      <g fill="#a3591d">
        <use xlink:href="#cookie"/>
        <use xlink:href="#cookie" transform="translate(0 -1)"/>
        <use xlink:href="#cookie" transform="translate(0 -2)"/>
        <use xlink:href="#cookie" transform="translate(0 -3)"/>
        <use xlink:href="#cookie" transform="translate(0 -4)"/>
        <use xlink:href="#cookie" transform="translate(0 -5)"/>
        <use xlink:href="#cookie" transform="translate(0 -6)"/>
        <use xlink:href="#cookie" transform="translate(0 -7)"/>
        <use xlink:href="#cookie" transform="translate(0 -8)"/>
      </g>
      <use xlink:href="#cookie" transform="translate(0 -9)" fill="url(#cookie-top)" stroke="#ffffea" stroke-width="0.35"/>
      <use xlink:href="#chips" transform="translate(0 -9)" fill="#4a230c"/>
    </g>
  </g>

  <!-- The logo's arc of five stars: gold in the middle, floating above the stack -->
  <circle cx="1214" cy="76" r="120" fill="url(#glow-gold)"/>
  <g stroke-linejoin="round">
    <g fill="#bb0000" stroke="#ffffea" stroke-width="5">
      <use xlink:href="#star" transform="translate(1043 150) scale(17)" stroke-width="0.3"/>
      <use xlink:href="#star" transform="translate(1110 100) scale(26)" stroke-width="0.2"/>
      <use xlink:href="#star" transform="translate(1318 100) scale(26)" stroke-width="0.2"/>
      <use xlink:href="#star" transform="translate(1385 150) scale(17)" stroke-width="0.3"/>
    </g>
    <use xlink:href="#star" transform="translate(1214 78) scale(54)" fill="url(#gold)" stroke="#ffffea" stroke-width="0.11"/>
  </g>
  </g>
</svg>
